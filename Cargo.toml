[package]
name = "imageoptimize"
version = "0.6.0"
edition = "2021"
authors = ["Tree Xie <tree.xie@outlook.com>"]
categories = ["multimedia::images"]
keywords = ["image", "optimize"]
description = "Optimize image of multi format"
license = "Apache-2.0"
homepage = "https://github.com/vicanso/imageoptimize"
repository = "https://github.com/vicanso/imageoptimize"
exclude = ["assets/*", "test/*", "Cargo.lock"]
readme = "./README.md"
autobins = false


[lib]
name = "imageoptimize"
path = "src/lib.rs"

[[bin]]
name = "imageoptimize"
path = "bin/imageoptimize.rs"
required-features = ["bin"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["network", "jxl"]
bin = [
    "clap",
    "tokio/fs",
    "tokio/macros",
    "tokio/rt-multi-thread",
    "tokio/sync",
    "glob",
    "nu-ansi-term",
    "num_cpus",
]
# HTTP/base64 image loading (pulls reqwest + a TLS stack, ~2MB). Opt out with
# default-features = false to ship a file://-only build. tokio (already a reqwest
# dependency) runs the DNS lookups of the public-hosts-only mode off the async threads.
network = ["reqwest", "tokio"]
# JPEG XL encode/decode via the vendored libjxl (~1MB). Opt out to drop it.
jxl = ["jpegxl-rs"]

[dependencies]
avif-decode = "1.0.2"
avif-parse = "2.1.0"
base64 = "0.23.1"
bytes = "1.12.1"
kamadak-exif = "0.6.1"
clap = { version = "4.6.6", features = ["derive"], optional = true }
dssim-core = "3.5.1"
glob = { version = "0.3.4", optional = true }
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "avif",
    "rayon",
] }
jpegxl-rs = { version = "0.15", features = ["vendored"], optional = true }
imagequant = { version = "4.4.1", features = ["threads"] }
lodepng = "3.12.2"
mozjpeg = "0.10.13"
nu-ansi-term = { version = "0.50.3", optional = true }
num_cpus = { version = "1.17.0", optional = true }
qcms = "0.3.0"
reqwest = { version = "0.13.5", optional = true }
rgb = "0.8.52"
snafu = "0.9.2"
tokio = { version = "1.53.1", features = ["rt"], optional = true }
urlencoding = "2.1.3"
webp = "0.3.1"
img-parts = "0.4.0"
rayon = "1.12.0"
fast_image_resize = "6.1.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
tokio-test = "0.4.4"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
