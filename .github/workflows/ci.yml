name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      # The CLI only builds with the `bin` feature, and the slim build drops the default
      # `network` / `jxl` features: lint both so neither configuration rots.
      - name: Lint
        run: |
          cargo clippy --all-targets --features bin -- -D warnings
          cargo clippy --all-targets --no-default-features --features bin -- -D warnings
      - name: Run tests
        run: cargo test --features bin --verbose
      - name: Run tests without default features
        run: cargo test --no-default-features
